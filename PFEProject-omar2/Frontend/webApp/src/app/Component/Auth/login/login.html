<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900 mb-2">Welcome Back</h1>
      <p class="text-gray-600">Sign in to your account to continue</p>
    </div>

   
    <div class="bg-white rounded-lg shadow-lg p-8">
  
      <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg">
        <p class="text-red-700 text-sm font-medium">{{ errorMessage }}</p>
      </div>

   
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
     
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
          <input
            id="email"
            formControlName="email"
            type="email"
            placeholder="you@example.com"
            [disabled]="isLoading"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition disabled:bg-gray-50 disabled:cursor-not-allowed"
          />
          <p *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="mt-1 text-sm text-red-600">
            Please enter a valid email address
          </p>
        </div>

    
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
          <input
            id="password"
            formControlName="password"
            type="password"
            placeholder="••••••••"
            [disabled]="isLoading"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition disabled:bg-gray-50 disabled:cursor-not-allowed"
          />
          <p *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="mt-1 text-sm text-red-600">
            Password must be at least 6 characters
          </p>
        </div>

        <div class="flex items-center">
          <input
            id="rememberMe"
            formControlName="rememberMe"
            type="checkbox"
            [disabled]="isLoading"
            class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded cursor-pointer disabled:cursor-not-allowed"
          />
          <label for="rememberMe" class="ml-2 block text-sm text-gray-700 cursor-pointer">
            Remember me
          </label>
        </div>

      
        <button
          type="submit"
          [disabled]="form.invalid || isLoading"
          class="w-full mt-8 px-4 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center justify-center"
        >
          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading" class="flex items-center">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Signing in...
          </span>
        </button>
      </form>

     
      <div class="mt-6 text-center border-t border-gray-200 pt-6">
        <p class="text-gray-600 text-sm">
          Don't have an account?
          <a routerLink="/register" class="text-blue-600 hover:text-blue-700 font-medium transition">
            Sign up here
          </a>
        </p>
      </div>
    </div>
  </div>
</div>

<header class="kanban-header">
    <div>
        <h1>Kanban Board</h1>
        <p>Track your tasks and progress</p>
    </div>
    <div class="kanban-actions">
        <a class="ghost-button" routerLink="/profile">Profile</a>
        <button type="button" class="primary-button" (click)="logout()">Logout</button>
    </div>
</header>

<div class="board" cdkDropListGroup>
    <section class="board-column" *ngFor="let column of columns; trackBy: trackById">
        <header class="board-header">
            <h2 class="board-title">{{ column.title }}</h2>
            <div class="board-actions">
                <span class="board-count">{{ column.tasks.length }}</span>
                <button type="button" class="add-task-btn" (click)="addTask(column)">+</button>
            </div>
        </header>
        <div class="card-list" cdkDropList [id]="column.id" [cdkDropListData]="column.tasks"
            [cdkDropListConnectedTo]="connectedIds" (cdkDropListDropped)="drop($event)">
            <div class="card" *ngFor="let task of column.tasks; trackBy: trackByTask" cdkDrag>
                {{ task }}
            </div>
            <div class="card-placeholder" *ngIf="column.tasks.length === 0">Drop here</div>
        </div>
    </section>
</div>

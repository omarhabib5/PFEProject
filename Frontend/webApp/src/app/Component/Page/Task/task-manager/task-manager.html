<div class="task-manager">
    <div class="header">
        <h1>Task management</h1>

        <div class="header-actions">
            <button class="btn-reset" type="button" (click)="startCreate()">New task</button>
            <a class="btn-reset" routerLink="/kanban" [queryParams]="selectedProjectId ? { projectId: selectedProjectId } : null">Kanban View</a>
        </div>
    </div>

    <div *ngIf="error" class="error">{{ error }}</div>

    <div class="content-grid">
        <div class="card">
            <h2>{{ editMode ? 'Edit task' : 'Create task' }}</h2>

            <div class="form-group">
                <label>Title</label>
                <input [(ngModel)]="formModel.title" type="text" />
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea [(ngModel)]="formModel.description" rows="3"></textarea>
            </div>

            <div class="form-row">
             
                <div class="form-group">
                    <label>Complexity</label>
                    <input [(ngModel)]="formModel.complexity" type="number" min="1" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Status</label>
                    <select [(ngModel)]="formModel.status">
                        <option *ngFor="let option of statusOptions" [ngValue]="option.value">{{ option.label }}
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label>User Story</label>
                    <select [(ngModel)]="formModel.userStoryId" (ngModelChange)="onUserStoryChange()" [disabled]="selectedUserStoryId !== null">
                        <option [ngValue]="0" disabled>Select a user story</option>
                        <option *ngFor="let story of userStories" [ngValue]="+story.id">
                            {{ story.name || story.title || ('US #' + story.id) }}
                        </option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Start date</label>
                    <input [(ngModel)]="formModel.startDate" (ngModelChange)="onTaskStartDateChange()" type="date" [min]="taskMinDateInput" [max]="taskMaxDateInput" />
                </div>
                <div class="form-group">
                    <label>End date</label>
                    <input [(ngModel)]="formModel.endDate" type="date" [min]="formModel.startDate || taskMinDateInput" [max]="taskMaxDateInput" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Assign to</label>
                    <select [(ngModel)]="formModel.assignedToId">
                        <option [ngValue]="null">Unassigned</option>
                        <option *ngFor="let user of assignableUsers" [ngValue]="user.id">
                            {{ getUserLabel(user) }}
                        </option>
                    </select>
                </div>
                <div class="form-group"></div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-primary" (click)="saveTask()" [disabled]="saving">
                    {{ saving ? 'Saving...' : (editMode ? 'Update' : 'Create') }}
                </button>
            </div>
        </div>

        <div class="card" if >
            <h2>Task list</h2>

            <div *ngIf="loading" class="loading-state">Loading...</div>

            <div *ngIf="!loading && tasks.length === 0" class="empty-state">
                No task available.
            </div>

            <div *ngIf="!loading && tasks.length > 0" class="task-list">
                <div class="task-item" *ngFor="let task of tasks" >
                    <div class="task-item-head">
                        <h3>{{ task.title }}</h3>
                        <span class="status">{{ getStatusLabel(task.status) }}</span>
                    </div>
                    <p>{{ task.description }}</p>
                    <div class="meta">
                        <span>{{ getUserStoryLabel(task.userStoryId) }}</span>
                        <span>{{ task.estimatedHours }}h</span>
                    </div>
                    <div class="item-actions">
                        <button class="btn-link" type="button" (click)="startEdit(task, $event)">Edit</button>
                        <button class="btn-link" type="button" (click)="deleteTask(task, $event)" [disabled]="!canDeleteTask(task)">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

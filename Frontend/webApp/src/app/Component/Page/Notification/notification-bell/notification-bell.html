<div class="relative">
  <!-- Bell Button -->
  <button
    (click)="toggleDropdown()"
    class="relative inline-flex items-center justify-center w-10 h-10 rounded-full bg-transparent hover:bg-[#1a1f2e] transition-colors cursor-pointer group"
    aria-label="Notifications"
  >
    <!-- Bell Icon -->
    <svg
      class="w-6 h-6 text-gray-300 group-hover:text-[#4ade80] transition-colors"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
      />
    </svg>

    <!-- Unread Badge -->
    <span
      *ngIf="unreadCount > 0"
      class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/2 -translate-y-1/2 bg-[#ef4444] rounded-full"
    >
      {{ unreadCount > 99 ? '99+' : unreadCount }}
    </span>
  </button>

  <!-- Dropdown Panel -->
  <app-notification-dropdown
    *ngIf="showDropdown"
    (close)="closeDropdown()"
  />
</div>

<div class="reset-page">
  <section class="reset-card">
    <header class="reset-header">
      <h2>Reinitialiser le mot de passe</h2>
      <p>Definissez un nouveau mot de passe pour votre compte.</p>
    </header>

    <div *ngIf="errorMessage" class="message error-message">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="message success-message">
      {{ successMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="reset-form">
      <div class="field">
        <label for="newPassword">Nouveau mot de passe</label>
        <input
          id="newPassword"
          type="password"
          formControlName="newPassword"
          placeholder="Minimum 6 caracteres"
          [disabled]="isSubmitting"
        />
        <small *ngIf="form.get('newPassword')?.invalid && form.get('newPassword')?.touched">
          Minimum 6 caracteres requis
        </small>
      </div>

      <div class="field">
        <label for="confirmNewPassword">Confirmer le nouveau mot de passe</label>
        <input
          id="confirmNewPassword"
          type="password"
          formControlName="confirmNewPassword"
          placeholder="Retapez le mot de passe"
          [disabled]="isSubmitting"
        />
        <small *ngIf="form.get('confirmNewPassword')?.invalid && form.get('confirmNewPassword')?.touched">
          Minimum 6 caracteres requis
        </small>
      </div>

      <button type="submit" class="submit-btn" [disabled]="form.invalid || isSubmitting">
        <ng-container *ngIf="!isSubmitting">Valider</ng-container>
        <ng-container *ngIf="isSubmitting">Validation...</ng-container>
      </button>

      <a routerLink="/login" class="back-link">Retour a la connexion</a>
    </form>
  </section>
</div>

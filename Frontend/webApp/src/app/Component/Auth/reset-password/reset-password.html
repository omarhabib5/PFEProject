<div class="reset-page">
  <section class="reset-card">
    <header class="reset-header">
      <h2>Reset password</h2>
      <p>Set a new password for your account.</p>
    </header>

    <div *ngIf="errorMessage" class="message error-message">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="message success-message">
      {{ successMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="reset-form">
      <div class="field">
        <label for="newPassword">New password</label>
        <input
          id="newPassword"
          type="password"
          formControlName="newPassword"
          placeholder="Minimum 6 characters"
          [disabled]="isSubmitting"
        />
        <small *ngIf="form.get('newPassword')?.invalid && form.get('newPassword')?.touched">
          Minimum 6 characters required
        </small>
      </div>

      <div class="field">
        <label for="confirmNewPassword">Confirm new password</label>
        <input
          id="confirmNewPassword"
          type="password"
          formControlName="confirmNewPassword"
          placeholder="Re-enter password"
          [disabled]="isSubmitting"
        />
        <small *ngIf="form.get('confirmNewPassword')?.invalid && form.get('confirmNewPassword')?.touched">
          Minimum 6 caracteres requis
        </small>
      </div>

      <button type="submit" class="submit-btn" [disabled]="form.invalid || isSubmitting">
        <ng-container *ngIf="!isSubmitting">Submit</ng-container>
        <ng-container *ngIf="isSubmitting">Submitting...</ng-container>
      </button>

      <a routerLink="/login" class="back-link">Back to login</a>
    </form>
  </section>
</div>
